experimental = ["setup-scripts"]

[profile.default]
# Mark tests that take longer than 10s as slow.
# Terminate after 120s as a stop-gap measure to terminate on deadlock.
slow-timeout =  { period = "10s", terminate-after = 12 }

[profile.ci]
test-threads = 20
status-level = "skip"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false

[profile.ci-linux]
inherits = "ci"

[profile.ci-macos]
inherits = "ci"
test-threads = 12

[profile.ci-windows]
inherits = "ci"
# The Windows suite is process- and I/O-heavy, so scale parallelism with the runner.
test-threads = "num-cpus"

[test-groups]
serial = { max-threads = 1 }
io-bound = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(native_auth)'
test-group = 'serial'

[[profile.default.overrides]]
filter = 'package(fyn-keyring)'
test-group = 'serial'

[[profile.ci-macos.overrides]]
filter = 'test(/^python_install::python_install_pyodide$/)'
# This test downloads and installs multiple Pyodide distributions plus CPython.
# Slow network or disk I/O on macOS CI can legitimately push it past the
# general 120s deadlock guard.
slow-timeout = { period = "30s", terminate-after = 10 }

[[profile.ci-windows.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'test(/^python_install::/) + test(/^python_update::/) + test(/^python_find::/) + test(/^python_upgrade::/)'
test-group = 'io-bound'
priority = 1 # Start earlier so these can complete before the end

[[profile.ci-windows.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'test(/^network::connect_timeout_index$/) + test(/^network::connect_timeout_stream$/)'
# These tests assert a one-second timeout against wall-clock time, so run them without contention.
threads-required = "num-test-threads"
priority = 100

[[profile.ci-windows.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'test(/^python_upgrade::python_upgrade$/) + test(/^python_find::python_find_prerelease_version_specifiers$/)'
# Each test installs several complete Python distributions and routinely exceeds
# the general deadlock guard on standard Windows runners.
threads-required = "num-test-threads"
slow-timeout = { period = "30s", terminate-after = 10 }

[scripts.setup.setup-hook-unix]
command = "scripts/nextest-setup-hook-unix.sh"

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = "all()"
setup = "setup-hook-unix"
